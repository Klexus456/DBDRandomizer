name: Deploy DBD Randomizer

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Publish Blazor WebAssembly
        run: dotnet publish DBDRandomizerWeb/DBDRandomizerWeb.csproj -c Release

      - name: Add .nojekyll
        run: touch DBDRandomizerWeb/bin/Release/net8.0/publish/wwwroot/.nojekyll

      - name: Fix base href
        run: sed -i 's|<base href="/" />|<base href="/DBDRandomizer/" />|' DBDRandomizerWeb/bin/Release/net8.0/publish/wwwroot/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: DBDRandomizerWeb/bin/Release/net8.0/publish/wwwroot

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4